name: Run Tests

on:
  pull_request:
    branches:
      - develop
      - main
      - feat/consultation
    paths:
      - "src/**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    environment: development
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run Tests
        run: ./mvnw clean verify -B

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Post coverage comment
        uses: madrapps/jacoco-report@v1.6.1
        if: success() || failure()
        with:
          paths: ./target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK is empty or not configured — add a repository secret named DISCORD_WEBHOOK with your Discord incoming webhook URL."
            exit 0
          fi
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "📬 New PR: ${{ github.event.pull_request.title }}",
                "url": "${{ github.event.pull_request.html_url }}",
                "color": 5814783,
                "fields": [
                  { "name": "Author", "value": "${{ github.event.pull_request.user.login }}", "inline": true },
                  { "name": "Branch", "value": "${{ github.event.pull_request.head.ref }}", "inline": true },
                  { "name": "Target", "value": "${{ github.event.pull_request.base.ref }}", "inline": true }
                ]
              }]
            }' \
            "$DISCORD_WEBHOOK"