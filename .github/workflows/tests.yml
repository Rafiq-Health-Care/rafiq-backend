name: Run Tests

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - dev

jobs:
  test:
    name: All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run All Tests
        run: ./mvnw clean test
        env:
          SPRING_PROFILES_ACTIVE: test
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          FACEBOOK_CLIENT_ID: test-facebook-client-id
          FACEBOOK_CLIENT_SECRET: test-facebook-client-secret
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: 587
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test-password
          MAIL_PROTOCOL: smtp
          GOOGLE_GENAI_API_KEY: test-genai-key
          CLOUDINARY_CLOUD_NAME: dbdkrenhl
          CLOUDINARY_API_KEY: 974593956567557
          CLOUDINARY_API_SECRET: 3PAziKNw52iCHEaFMia0iOVMz-4
          JWT_SECRET: test-jwt-secret-key-minimum-256-bits-for-hs256-algorithm
          JWT_EXPIRATION: 3600000
          REFRESH_EXPIRATION: 86400000
          OTP_EXPIRATION: 300000
          ACCESS_TOKEN_EXPIRATION: 3600000

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 30
