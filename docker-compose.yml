
services:
  postgres:
    image: postgres:15
    container_name: rafiq-db
    environment:
      POSTGRES_DB: rafiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5460:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - rafiq-network

