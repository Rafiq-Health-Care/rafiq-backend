  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    restart: always
    networks:
      - rafiq-network

  mail-dev:
    image: maildev/maildev:latest
    container_name: mail-dev
    ports:
      - "3080:3080"  # Web UI (http://localhost:3080)
      - "1025:1025"  # SMTP server
    command: [ "--web", "3080", "--smtp", "1025", "--web-ip", "0.0.0.0" ]
    restart: unless-stopped
    networks:
      - rafiq-network

networks:
  rafiq-network:

volumes:
  postgres-data:
    name: rafiq-postgres-data
