services:
  postgres:
    image: postgres:latest
    container_name: rafiq-db
    environment:
      POSTGRES_DB: rafiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5460:5432"
    restart: always

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    restart: always


