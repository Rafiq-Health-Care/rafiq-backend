
services:
  postgres:
    image: postgres:15
    container_name: rafiq-db
    environment:
      POSTGRES_DB: rafiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5460:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - rafiq-network

#  spring:
#    image: rafiqhealthcare/rafiq:1.0
#    container_name: rafiq-api
#    ports:
#      - "8032:8032"
#    depends_on:
#      - postgres
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rafiq
#      SPRING_DATASOURCE_USERNAME: postgres
#      SPRING_DATASOURCE_PASSWORD: root
##    networks:
#      - rafiq-network

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres
    restart: always
    networks:
      - rafiq-network

  mail-dev:
    image: maildev/maildev:latest
    container_name: mail-dev
    ports:
      - "3080:3080"
      - "1025:1025"
    command: [ "--web", "3080", "--smtp", "1025", "--web-ip", "0.0.0.0" ]
    restart: unless-stopped
    networks:
      - rafiq-network

networks:
  rafiq-network:

volumes:
  postgres-data:
