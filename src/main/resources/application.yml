# ---------------------------------------------------------------------------
# Application — shared configuration (all profiles)
# ---------------------------------------------------------------------------
spring:
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
                  max-active: 10
                  max-idle: 5
                  min-idle: 1
  application:
    name: rafiq
  profiles:
    active: dev
  # --- Datasource -----------------------------------------------------------
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --- JPA / Hibernate ------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        cache:
          use_second_level_cache: true
          use_query_cache: false
          region.factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: ${REDISSON_CONFIG:redisson-dev.yaml}
            default-query-results-region.expiration.time_to_live: 60000
            roles:
              expiration:
                time_to_live: 60000
                max_idle_time: 2000
              eviction:
                max_entries: 1000
                mode: LRU

  # --- Flyway ---------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial DB
    locations:
      - classpath:db/migration
      - classpath:com/nexaworks/rafiq/db/migration
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    out-of-order: true
    validate-on-migrate: true
    clean-disabled: true

  # --- Redis ----------------------------------------------------------------


  # --- RabbitMQ -------------------------------------------------------------
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: false

  # --- Mail -----------------------------------------------------------------
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          trust: "*"

  # --- Multipart ------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # --- OAuth2 ---------------------------------------------------------------
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}

  # --- Google AI ------------------------------------------------------------
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: 8030
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100

# ---------------------------------------------------------------------------
# Security — JWT & tokens
# ---------------------------------------------------------------------------
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

refresh:
  expiration: ${REFRESH_EXPIRATION}

otp:
  expiration: ${OTP_EXPIRATION}

access:
  token:
    expiration: ${ACCESS_TOKEN_EXPIRATION}

# ---------------------------------------------------------------------------
# External Services
# ---------------------------------------------------------------------------
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

agora:
  app-id: ${AGORA_APP_ID}
  app-certificate: ${AGORA_APP_CERTIFICATE}

stripe:
  api-key: ${STRIPE_API_SECRET}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

# ---------------------------------------------------------------------------
# JobRunr
# ---------------------------------------------------------------------------
jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: 4040

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: caches,health,metrics

logging:
  level:
    root: INFO

sentry:
  dsn: https://ae1a1982e94b88ae5230753a1b2767b7@o4511429007572992.ingest.us.sentry.io/4511429008752640
  environment: dev
  tracesSampleRate: 1.0
app:
  firebase:
    config-base64: ${FIREBASE_CONFIG}

