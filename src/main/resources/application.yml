spring:
  # Dev tools config
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  # Application config
  application:
    name: rafiq
  config:
    import: optional:file:./.env.properties

  # Database config
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
   # JPA config
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # Flyway config - must run before JPA validation
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration,classpath:com/nexaworks/rafiq/db/migration
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    baseline-description: Initial DB
    baseline-version: 0

    # Allow out-of-order migrations if some were missed
    out-of-order: true
    # Validate migrations on startup
    validate-on-migrate: true
    # Clean disabled for safety (set to false in production)
    clean-disabled: true
  # FileMetaData upload config
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # OAuth2 config
  security:
    oauth2:
      client:
        registration:
          # Google
          google:
            client-id: ${GOOGLE_CLIENT_ID}
          # Facebook
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
  # Quartz scheduler config
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          jobStore:
            dataSource: quartzDataSource
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          dataSource:
            quartzDataSource:
              provider: hikaricp
              driver: org.postgresql.Driver
              URL: ${spring.datasource.url}
              user: ${spring.datasource.username}
              password: ${spring.datasource.password}
          scheduler:
            instanceName: RafiqScheduler
          threadPool:
            threadCount: 1
  # Mail config
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          trust: "*"
  # AI config
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        # Cloudinary config
        chat:
          options:
            model: gemini-2.5-flash

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  # JWT config
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  # Refresh token config
refresh:
  expiration: ${REFRESH_EXPIRATION}
  # OTP config
otp:
  expiration: ${OTP_EXPIRATION}
  # Access token config
access:
  token:
    expiration: ${ACCESS_TOKEN_EXPIRATION}
  # Server config
server:
  port: 8030
  tomcat:
    threads:
      max: 10
      min-spare: 2
    accept-count: 5

