spring:
  profiles:
    active: dev
  # Application config (devtools + SQL logging: application-dev.yml / application-prod.yml)
  application:
    name: rafiq

  # Database config
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
   # JPA config
  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # Flyway config - must run before JPA validation
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration,classpath:com/nexaworks/rafiq/db/migration
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    baseline-description: Initial DB
    baseline-version: 0

    # Allow out-of-order migrations if some were missed
    out-of-order: true
    # Validate migrations on startup
    validate-on-migrate: true
    # Clean disabled for safety (set to false in production)
    clean-disabled: true
  # File upload config
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  # OAuth2 config
  security:
    oauth2:
      client:
        registration:
          # Google
          google:
            client-id: ${GOOGLE_CLIENT_ID}
          # Facebook
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
 # RabbitMQ config
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: false

  # Mail config
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: ${MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
          trust: "*"
  # AI config
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
  # Cloudinary config
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  # JWT config
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  # Refresh token config
refresh:
  expiration: ${REFRESH_EXPIRATION}
  # OTP config
otp:
  expiration: ${OTP_EXPIRATION}
  # Access token config
access:
  token:
    expiration: ${ACCESS_TOKEN_EXPIRATION}
  # Agora config
agora:
   app-id: ${AGORA_APP_ID}
   app-certificate: ${AGORA_APP_CERTIFICATE}
  #Stripe
stripe:
  api-key: ${STRIPE_API_SECRET}
  webhook-secret: "whsec_b5b9bf42a17d8e3c1e89c3fe483fa75131596fd5b9b3110f2d3f88b13e83f448"
  # Jobrunner config
jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true
    port: 8080


  # Server config
server:
  port: 8030
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
logging:
  level:
    root: INFO
