# ---------------------------------------------------------------------------
# Profile: prod — overrides for production
# ---------------------------------------------------------------------------
spring:
  config:
    import: optional:file:.env.prod[.properties]

  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

logging:
  level:
    root: WARN
