spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      max-lifetime: 30000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  sql:
    init:
      mode: never
  lifecycle:
   timeout-per-shutdown-phase: 20s