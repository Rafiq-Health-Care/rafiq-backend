spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 60000
      connection-timeout: 10000
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  lifecycle:
   timeout-per-shutdown-phase: 20s
  test:
    database:
      replace: none
